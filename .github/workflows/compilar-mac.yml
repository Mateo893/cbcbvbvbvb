name: Compilar Jarvis para macOS

on:
  workflow_dispatch: # Permite ejecutar la compilación con un solo botón

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Empaquetar Jarvis en archivo de Mac (.app)
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Jarvis" jarvis.pyw
          cd dist
          zip -r Jarvis-Mac.zip Jarvis.app

      - name: Subir archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Para-Mac
          path: dist/Jarvis-Mac.zip
